name: CI

# Pre-merge sanity check on pull requests. Merging to main hands off to
# .github/workflows/deploy.yml, which re-runs this same suite before it
# builds and rolls out, so there is no push trigger here to duplicate it.
# Neither workflow needs an AWS access key: deploy.yml authenticates with
# GitHub OIDC. There are no secrets to configure in this repository.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Fails the build if a dependency picks up a new high/critical
      # advisory. Drop the --audit-level or this step if upstream noise
      # makes it too disruptive.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Lambda handler unit tests
        run: npm run test:lambda

      - name: Next.js build check
        run: npm run build
