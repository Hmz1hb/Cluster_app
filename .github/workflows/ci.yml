name: CI

# Pre-merge sanity check. Deployment is a separate path (Docker image ->
# ECR -> ECS/Fargate, see ecs/task-definition.json), so this workflow needs
# no AWS credentials and there are no secrets to configure here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Fails the build if a dependency picks up a new high/critical
      # advisory. Drop the --audit-level or this step if upstream noise
      # makes it too disruptive.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Lambda handler unit tests
        run: npm run test:lambda

      - name: Next.js build check
        run: npm run build
